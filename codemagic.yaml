workflows:
  zag-science-ios:
    name: Zag Science iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: 22
      xcode: latest

    scripts:
      - name: Install dependencies
        script: |
          npm ci
          npm install @capacitor/local-notifications@^8 @capacitor/push-notifications@^8 --no-save --package-lock=false

      - name: Prepare web app
        script: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js www/
          cp -R assets www/

      - name: Generate iOS project
        script: |
          npx cap add ios
          npx cap sync ios

      - name: Build iOS simulator app
        script: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - build/Build/Products/Debug-iphonesimulator/*.app

      
  zag-science-iphone:
    name: Zag Science iPhone Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: "Zag Science Codemagic"

    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.zagscience.app

    scripts:
      - name: Install dependencies
        script: |
          npm ci
          npm install @capacitor/local-notifications@^8 @capacitor/push-notifications@^8 --no-save --package-lock=false

      - name: Prepare web app
        script: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js www/
          cp -R assets www/

      - name: Generate iOS project
        script: |
          npx cap add ios
          npx cap sync ios
          
      - name: Set Zag Science home screen icon
        script: |
          ICON_DIR="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICON_DIR"
          cp assets/icons/ios-app-icon.png "$ICON_DIR/AppIcon-512@2x.png"
          cat > "$ICON_DIR/Contents.json" <<'EOF'
          {
            "images": [
              {"filename": "AppIcon-512@2x.png", "idiom": "universal", "platform": "ios", "size": "1024x1024"}
            ],
            "info": {"author": "xcode", "version": 1}
          }
          EOF

      - name: Enable iOS push entitlement
        script: |
          mkdir -p ios/App/App
          printf '%s' '<?xml version="1.0" encoding="UTF-8"?><plist version="1.0"><dict><key>aps-environment</key><string>production</string></dict></plist>' > ios/App/App/App.entitlements
          sed -i '' '/PRODUCT_BUNDLE_IDENTIFIER = com.zagscience.app;/i\
          CODE_SIGN_ENTITLEMENTS = App/App.entitlements;
          ' ios/App/App.xcodeproj/project.pbxproj

      - name: Apply Apple signing profile
        script: |
          xcode-project use-profiles

      - name: Build signed iPhone IPA
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        
