workflows:
  zag-science-ios:
    name: Zag Science iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: 22
      xcode: latest

    scripts:
      - name: Install dependencies
        script: |
          # Resolve permanent plugin dependencies and refresh the lockfile on the build machine.
          # Once the updated lockfile is committed, this can switch back to npm ci.
          npm install --no-audit --no-fund

      - name: Prepare web app
        script: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js www/
          cp -R assets www/

      - name: Bundle native notification bridge
        script: |
          set -e
          cat > zag-native-entry.js <<'EOF'
          import { LocalNotifications } from '@capacitor/local-notifications';
          import { PushNotifications } from '@capacitor/push-notifications';
          window.ZagNativePlugins = { LocalNotifications, PushNotifications };
          EOF
          npx esbuild zag-native-entry.js --bundle --platform=browser --format=iife --target=es2020 --outfile=www/zag-native-bridge.js
          test -s www/zag-native-bridge.js

      - name: Generate iOS project
        script: |
          npx cap add ios
          npx cap sync ios
          echo "--- Capacitor plugin discovery ---"
          npx cap ls ios
          echo "--- Native plugin package checks ---"
          test -d node_modules/@capacitor/local-notifications
          test -d node_modules/@capacitor/push-notifications
          echo "Both notification plugin packages are installed"

      - name: Build iOS simulator app
        script: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - build/Build/Products/Debug-iphonesimulator/*.app

      
  zag-science-iphone:
    name: Zag Science iPhone Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: "Zag Science Codemagic"

    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.zagscience.app

    scripts:
      - name: Install dependencies
        script: |
          # Resolve permanent plugin dependencies and refresh the lockfile on the build machine.
          # Once the updated lockfile is committed, this can switch back to npm ci.
          npm install --no-audit --no-fund

      - name: Prepare web app
        script: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js www/
          cp -R assets www/

      - name: Bundle native notification bridge
        script: |
          set -e
          cat > zag-native-entry.js <<'EOF'
          import { LocalNotifications } from '@capacitor/local-notifications';
          import { PushNotifications } from '@capacitor/push-notifications';
          window.ZagNativePlugins = { LocalNotifications, PushNotifications };
          EOF
          npx esbuild zag-native-entry.js --bundle --platform=browser --format=iife --target=es2020 --outfile=www/zag-native-bridge.js
          test -s www/zag-native-bridge.js

      - name: Generate iOS project
        script: |
          npx cap add ios
          npx cap sync ios
          echo "--- Capacitor plugin discovery ---"
          npx cap ls ios
          echo "--- Native plugin package checks ---"
          test -d node_modules/@capacitor/local-notifications
          test -d node_modules/@capacitor/push-notifications
          echo "Both notification plugin packages are installed"
          
      - name: Set Zag Science home screen icon
        script: |
          ICON_DIR="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICON_DIR"
          cp assets/icons/ios-app-icon.png "$ICON_DIR/AppIcon-512@2x.png"
          cat > "$ICON_DIR/Contents.json" <<'EOF'
          {
            "images": [
              {"filename": "AppIcon-512@2x.png", "idiom": "universal", "platform": "ios", "size": "1024x1024"}
            ],
            "info": {"author": "xcode", "version": 1}
          }
          EOF

      - name: Connect Apple push registration to Capacitor
        script: |
          set -e
          python3 - <<'PYTHON'
          from pathlib import Path
          p = Path('ios/App/App/AppDelegate.swift')
          s = p.read_text()
          if 'capacitorDidRegisterForRemoteNotifications' not in s:
              if 'class AppDelegate' not in s or not s.rstrip().endswith('}'):
                  raise SystemExit('Unexpected AppDelegate.swift; cannot safely patch APNs callbacks')
              i = s.rfind('}')
              s = s[:i] + '\n    // Forward Apple push registration to Capacitor Push Notifications.\n    func application(_ application: UIApplication, didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data) {\n        NotificationCenter.default.post(name: .capacitorDidRegisterForRemoteNotifications, object: deviceToken)\n    }\n\n    func application(_ application: UIApplication, didFailToRegisterForRemoteNotificationsWithError error: Error) {\n        NotificationCenter.default.post(name: .capacitorDidFailToRegisterForRemoteNotifications, object: error)\n    }\n' + '\n' + s[i:]
              p.write_text(s)
              print('Added APNs callbacks to AppDelegate.swift')
          else:
              print('APNs callbacks already present')
          PYTHON

      - name: Enable iOS push entitlement
        script: |
          mkdir -p ios/App/App
          printf '%s' '<?xml version="1.0" encoding="UTF-8"?><plist version="1.0"><dict><key>aps-environment</key><string>production</string></dict></plist>' > ios/App/App/App.entitlements
          sed -i '' '/PRODUCT_BUNDLE_IDENTIFIER = com.zagscience.app;/i\
          CODE_SIGN_ENTITLEMENTS = App/App.entitlements;
          ' ios/App/App.xcodeproj/project.pbxproj

      - name: Automatically increment iPhone build number
        script: |
          set -e
          cd ios/App
          # Codemagic increases PROJECT_BUILD_NUMBER for each new build.
          # Offset ensures the first new build exceeds Apple's existing build 1.
          NEXT_BUILD_NUMBER=$(( ${PROJECT_BUILD_NUMBER:-1} + 1000 ))
          agvtool new-version -all "$NEXT_BUILD_NUMBER"
          echo "Zag Science iOS build number: $NEXT_BUILD_NUMBER"

      - name: Apply Apple signing profile
        script: |
          xcode-project use-profiles

      - name: Build signed iPhone IPA
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        
