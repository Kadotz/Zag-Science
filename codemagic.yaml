workflows:
  zag-science-ios:
    name: Zag Science iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: 22
      xcode: latest

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Prepare web app
        script: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js www/
          cp -R assets www/

      - name: Generate iOS project
        script: |
          npx cap add ios
          npx cap sync ios

      - name: Build iOS simulator app
        script: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - build/Build/Products/Debug-iphonesimulator/*.app